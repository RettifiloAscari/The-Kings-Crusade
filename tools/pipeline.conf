# Per-repository settings for the shared authoring tools.
#
# tools/anchor.py, normalize_escapes.py, check_columns.py, find_page.py and
# verify.sh are byte-identical between The King's Crusade and The Qilvayas
# Symphony. Everything that differs between the two repositories lives here, so
# a fix to a tool is a copy rather than a re-derivation.
#
# Shell syntax; sourced by verify.sh and parsed by check_columns.py.

# Generators whose document is rendered single-column (build.sh's SINGLE_COL_MATCH).
# Their tables get the full page width, so the column checker skips them. Named by
# generator file, because the generator name and the document name do not always
# match in every repository.
SINGLE_COLUMN_GENERATORS="KC_DM_Reference_Guide.js"

# Usable text width, in inches, of ONE column of the two-column body.
#   A4 is 11906 twips wide; the template takes 864 left and 1008 right, and the
#   two-column section leaves 360 between columns:
#     (11906 - 864 - 1008 - 360) / 2 = 4837 twips per column
#   less this repository's cell margins (60 twips each side, per cell()):
#     4837 - 120 = 4717 twips = 3.28in
# The sister repository uses 45-twip margins and so runs 3.30. Re-derive this if
# cell() ever changes its margins.
COLUMN_WIDTH_IN="3.28"

# Documents that may be handed to a player. Scanned for DM material on every
# verify run. Paths relative to the repository root.
PLAYER_FACING="corpus/KC_Player_Guide.md corpus/KC_Character_Options.md"

# Strings that must never appear in a player-facing document.
LEAK_MARKERS="DM Only|DM note"

# Phrases that only a DM-facing document would use. Deliberately narrow: "the party"
# and "the module" read perfectly naturally in player prose ("the rest of the party"),
# and a scan that flags them is a scan people learn to ignore.
LEAK_MECHANICAL="the DM should|pacing budget|read-aloud|boxed text|Diverging Paths|Branch Ledger|DM-facing"

# Campaign secrets that must not reach a player-facing document. Left empty until
# the DM-only material settles: Tenth Work, the Ysolde Archive and Wyvernheart all
# appear legitimately in player-facing text and are NOT secrets. Add a term here
# only once it is genuinely DM-only, or the scan becomes noise.
LEAK_SECRETS=""
